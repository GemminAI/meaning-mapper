[project]
name = "meaning-mapper"
version = "1.0.0"
description = "Meaning Mapper — reference service that maps raw observations into HEXT Observation Objects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Gemmina Intelligence LLC." }]
keywords = [
    "meaning-mapper",
    "observation",
    "hext",
    "normalization",
    "semantic",
    "sensos",
    "open-standards",
    "gemminai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "semantic-annotator @ git+https://github.com/GemminAI/semantic-annotator-core.git@v1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.7",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
]

[project.scripts]
meaning-mapper = "meaning_mapper.cli:main"
# Deprecated compatibility entry point — prefer meaning-mapper
semantic-annotator = "meaning_mapper.cli:main_compat"

[project.urls]
Homepage = "https://github.com/GemminAI/meaning-mapper"
Documentation = "https://github.com/GemminAI/meaning-mapper#readme"
Repository = "https://github.com/GemminAI/meaning-mapper"
"Open Standards" = "https://sensos.org/Open-Standards"
"Reference Library" = "https://github.com/GemminAI/semantic-annotator-core"
HEXT = "https://github.com/HEXT-AI/hxt-spec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["meaning_mapper"]

[tool.hatch.build.targets.wheel.force-include]
"src/meaning_mapper" = "meaning_mapper"

[tool.hatch.build.targets.sdist]
include = [
  "src/meaning_mapper",
  "docs",
  "examples",
  "tests",
  "LICENSE",
  "NOTICE",
  "README.md",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
