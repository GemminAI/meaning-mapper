[project]
name = "meaning-mapper"
version = "2.3.0"
description = "Meaning Mapper — the SensOS Meaning Measurement engine: HEXT Observation -> MeaningMeasurement"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Gemmina Intelligence LLC." }]
keywords = [
    "meaning-mapper",
    "meaning-measurement",
    "hext",
    "geometry",
    "sensos",
    "open-standards",
    "gemminai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/GemminAI/meaning-mapper"
Documentation = "https://github.com/GemminAI/meaning-mapper#readme"
Repository = "https://github.com/GemminAI/meaning-mapper"
"Open Standards" = "https://sensos.org/Open-Standards"
"Reference Library" = "https://github.com/GemminAI/semantic-annotator-core"
"Downstream Runtime" = "https://github.com/GemminAI/meaning-space-runtime"
HEXT = "https://github.com/HEXT-AI/hxt-spec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["meaning_mapper"]

[tool.hatch.build.targets.wheel.force-include]
"src/meaning_mapper" = "meaning_mapper"

[tool.hatch.build.targets.sdist]
include = [
  "src/meaning_mapper",
  "docs",
  "tests",
  "LICENSE",
  "NOTICE",
  "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-v --tb=short --cov=meaning_mapper --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["meaning_mapper"]

[tool.coverage.report]
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
# Type-checked against 3.12 stub syntax (numpy's .pyi requires it); the
# package itself still only uses >=3.11 language features (requires-python).
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
