name: meaning-mapper

services:
  meaning-mapper:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: gemminai/meaning-mapper:1.0.0
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
